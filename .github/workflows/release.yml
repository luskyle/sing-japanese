name: Qt Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release version
        run: |
          VERSION="$(sed -n 's/^project(sing_japanese VERSION \([^ )]*\).*/\1/p' CMakeLists.txt)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake qtbase5-dev qtmultimedia5-dev \
            libqt5multimedia5-plugins libmecab-dev mecab-ipadic-utf8 \
            fonts-noto-cjk gstreamer1.0-plugins-good poppler-utils
      - name: Build, test, and package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          cmake --build build --target package
      - name: Publish Debian installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" build/*.deb \
            --verify-tag --draft --generate-notes \
            --title "假名小调 $RELEASE_TAG" \
            --notes "Linux Qt 桌面版：假名学习、离线日语注音及 A4 PDF 导出。需要 Qt 5、MeCab/IPADIC 和 GStreamer 运行依赖。"
