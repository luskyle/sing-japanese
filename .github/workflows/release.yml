name: Qt Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.3.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="$(sed -n 's/^project(sing_japanese VERSION \([^ )]*\).*/\1/p' CMakeLists.txt)"
          test "$RELEASE_TAG" = "v$VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test -s ".github/release-notes/$RELEASE_TAG.md"
  build:
    needs: validate
    uses: ./.github/workflows/build-desktop.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*-x86_64
          merge-multiple: true
          path: release
      - name: Verify complete artifact set and generate checksums
        working-directory: release
        run: |
          VERSION="${RELEASE_TAG#v}"
          test -s "sing-japanese-$VERSION-Linux.deb"
          test -s "sing-japanese-$VERSION-Windows-x86_64.zip"
          test -s "sing-japanese-$VERSION-macOS-x86_64.dmg"
          sha256sum ./*.deb ./*.zip ./*.dmg > SHA256SUMS
      - name: Publish release
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "唱日语 $RELEASE_TAG" \
              --notes-file ".github/release-notes/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release/*.deb release/*.zip release/*.dmg release/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --title "唱日语 $RELEASE_TAG" \
            --notes-file ".github/release-notes/$RELEASE_TAG.md"
