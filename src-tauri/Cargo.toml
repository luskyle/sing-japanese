[package]
name = "sing-japanese"
version = "0.1.0"
description = "Offline kana pronunciation trainer"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
lindera = { version = "=0.43.3", features = ["ipadic", "compress"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
